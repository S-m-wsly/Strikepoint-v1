name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  PROJECT_DIR: strikepoint/strikepoint

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configure Android SDK, JDK and debug keystore
        run: |
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 9999 \
            -alias androiddebugkey -keypass android -storepass android \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/$f
          done

      - name: Import project
        run: godot --headless --path "$PROJECT_DIR" --import || true

      - name: Validate (fails on any script error)
        run: |
          godot --headless --path "$PROJECT_DIR" --quit-after 120 2>&1 | tee validate.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" validate.log; then exit 1; fi

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/strikepoint-debug.apk"
          test -f "$GITHUB_WORKSPACE/build/strikepoint-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: STRIKEPOINT-Android
          path: build/*.apk
